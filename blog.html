  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f7f5f0;
      --ink: #1a1814;
      --muted: #7a756a;
      --accent: #c0392b;
      --border: #e0dbd0;
      --max: 680px;
    }

    html {
      font-size: 16px;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Lora', Georgia, serif;
      line-height: 1.75;
      padding: 0 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: var(--max);
      margin: 0 auto;
    }

    /* ── Navigation ── */

    nav {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 2.5rem 0 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4rem;
    }

    .nav-name {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-decoration: none;
      color: var(--ink);
    }

    .site-logo {
      width: 1.45rem;
      height: auto;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }

    .nav-links a:hover {
      color: var(--ink);
    }

    /* ── Content ── */

    .blog {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.6s ease forwards 0.1s;
    }

    .back-link {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.15s;
    }

    .back-link:hover {
      color: var(--accent);
    }

    h1 {
      font-size: 1.8rem;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      font-weight: 600;
    }

    .subtitle {
      color: var(--muted);
      font-style: italic;
      max-width: 560px;
      margin-bottom: 3rem;
    }

    .empty-state {
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 0;
      max-width: 580px;
    }

    .empty-state p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .empty-state p:last-child {
      margin-bottom: 0;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 520px) {
      nav {
        flex-direction: column;
        gap: 1rem;
      }

      .nav-links {
        gap: 1.25rem;
        flex-wrap: wrap;
      }

      h1 {
        font-size: 1.45rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Navigation -->

    <nav>
      <a class="nav-name" href="index.html">
        <img
          class="site-logo"
          src="logo.svg"
          alt="Logo Arthus Goujon"
        />
        <span>Arthus Goujon</span>
      </a>

      <ul class="nav-links">
        <li><a href="blog.html">Blog</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="resume.html">Resume</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>


    <!-- Blog -->

    <main class="blog">

      <a href="index.html" class="back-link">
        ← Back to home
      </a>

      <h1>Blog</h1>

      <p class="subtitle">
        Notes on mathematics, machine learning, economics
        and quantitative finance.
      </p>

      <div class="empty-state">
        <p>
          Nothing published yet.
        </p>

        <p>
          I will use this space for research notes,
          technical explanations and experiments.
        </p>
      </div>

    </main>

  </div>
</body>
</html>
